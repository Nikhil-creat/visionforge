name: visionforge

x-api-env: &api-env
  env_file: [.env]
  environment:
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    DATA_DIR: /data
  volumes:
    - assets:/data
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ./backend
      target: ${BACKEND_TARGET:-cpu}
    <<: *api-env
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: ${BACKEND_TARGET:-cpu}
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info", "-c", "2"]
    <<: *api-env
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      target: ${BACKEND_TARGET:-cpu}
    command: ["celery", "-A", "app.worker.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    <<: *api-env
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["127.0.0.1:6333:6333"]
    volumes:
      - qdrant:/qdrant/storage
    restart: unless-stopped

volumes:
  assets:
  qdrant:
