# Render Blueprint: New -> Blueprint -> pick this repo. Free plan sleeps after 15 min idle (~1 min cold start).
services:
  - type: web
    name: visionforge-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - { key: GROQ_API_KEY, sync: false }        # paste in the Render dashboard (never commit keys)
      - { key: GEMINI_API_KEY, sync: false }
      - { key: CORS_ORIGINS, sync: false }        # e.g. https://nikhil-creat.github.io   (origin only, no path)
      - { key: QDRANT_URL, sync: false }          # optional: Qdrant Cloud URL (else in-memory, resets on sleep)
      - { key: QDRANT_API_KEY, sync: false }
      - { key: REDIS_URL, sync: false }           # optional: Upstash rediss:// URL (else in-memory rate limiter)
      - { key: TRUSTED_PROXY_HOPS, value: "1" }   # Render appends the real client IP to X-Forwarded-For
      - { key: WEB_CONCURRENCY, value: "1" }      # one worker keeps memory low on a small instance
      - { key: MAX_SIDE, value: "1280" }          # smaller tensors = fewer out-of-memory restarts
      - { key: MAX_UPLOAD_MB, value: "15" }
      - { key: DATA_DIR, value: /data }
